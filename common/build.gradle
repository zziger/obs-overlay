architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    modCompileOnlyApi ("me.shedaniel.cloth:cloth-config-fabric:$rootProject.cloth_config_version") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    modCompileOnlyApi("maven.modrinth:immediatelyfast:$rootProject.immediatelyfast_version-fabric")

    // JNA is required by the native hook (MinHook on Windows, libMinHook.so on
    // Linux). Declared explicitly so it does not silently rely on Minecraft's
    // own transitive JNA (via com.mojang:text2speech).
    implementation "net.java.dev.jna:jna:$rootProject.jna_version"
}
